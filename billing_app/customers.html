<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customers - Billing App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">

        <div class="logo">
            🧾 Billing App
        </div>

        <nav>
            <a href="index.html">Dashboard</a>
            <a href="customers.html">Customers</a>
            <a href="#">Products</a>
            <a href="new_bill.html">New Bill</a>
            <a href="#">Bill History</a>
        </nav>

    </header>


    <main class="dashboard">

        <h1>👥 Customers</h1>

        <p class="subtitle">
            Add and manage your customers
        </p>


        <!-- ADD CUSTOMER -->

        <section class="quick-actions">

            <h2>Add New Customer</h2>

            <form id="customerForm">

                <div class="form-grid">

                    <div>
                        <label>Customer Name</label>

                        <input type="text" id="customerName" placeholder="Enter customer name" required>
                    </div>


                    <div>
                        <label>Phone Number</label>

                        <input type="tel" id="customerPhone" placeholder="Enter phone number">
                    </div>


                    <div>
                        <label>Email</label>

                        <input type="email" id="customerEmail" placeholder="Enter email">
                    </div>


                    <div>
                        <label>Address</label>

                        <input type="text" id="customerAddress" placeholder="Enter address">
                    </div>

                </div>


                <button type="submit">
                    ➕ Add Customer
                </button>

            </form>

            <p id="customerMessage"></p>

        </section>


        <!-- CUSTOMER LIST -->

        <section class="recent">

            <h2>Customer List</h2>

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Email</th>
                        <th>Address</th>
                        <th>Action</th>
                    </tr>

                </thead>


                <tbody id="customerList">

                    <tr>
                        <td colspan="6">
                            Loading customers...
                        </td>
                    </tr>

                </tbody>

            </table>

        </section>

    </main>


    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="app.js"></script>

</body>

</html>
