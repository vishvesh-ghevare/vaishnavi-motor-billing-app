<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - VAISHNAVI MOTOR</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #fff3e8, #f7f7f7);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .login-box {
            width: 400px;
            max-width: 92%;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }
        
        .logo {
            text-align: center;
            font-size: 38px;
            margin-bottom: 10px;
        }
        
        h1 {
            text-align: center;
            margin: 0;
            color: #222;
            font-size: 25px;
        }
        
        .subtitle {
            text-align: center;
            color: #777;
            margin: 8px 0 28px;
            font-size: 14px;
        }
        
        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }
        
        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }
        
        input:focus {
            border-color: #f57c00;
            box-shadow: 0 0 0 3px rgba(245, 124, 0, 0.10);
        }
        
        .login-btn {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 9px;
            background: #f57c00;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .login-btn:hover {
            background: #e66f00;
        }
        
        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        #message {
            display: none;
            margin-top: 16px;
            padding: 11px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
        }
        
        .error {
            display: block !important;
            background: #ffeaea;
            color: #c62828;
        }
        
        .success {
            display: block !important;
            background: #e9f8ed;
            color: #218838;
        }
        
        .footer {
            text-align: center;
            margin-top: 25px;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">🧾</div>

        <h1>VAISHNAVI MOTOR</h1>

        <div class="subtitle">
            Billing App
        </div>

        <form id="loginForm">

            <label for="email">
                Email
            </label>

            <input type="email" id="email" placeholder="Enter your email" autocomplete="email" required>

            <label for="password">
                Password
            </label>

            <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>

            <button type="submit" id="loginButton" class="login-btn">
                🔐 Login
            </button>

        </form>

        <div id="message"></div>

        <div class="footer">
            VAISHNAVI MOTOR<br> Rewinding and Engineering Works
        </div>

    </div>


    <script>
        /*
                       =====================================================
                       SUPABASE CONNECTION
                       =====================================================
                    */

        const SUPABASE_URL =
            "https://icbajvpsbiqqbpotwcsd.supabase.co";

        /*
           Use your existing SUPABASE PUBLISHABLE KEY here.
           Do NOT use a service_role / secret key.
        */

        const SUPABASE_KEY =
            "sb_publishable_pJTpG_z7fhZl096K19mznw_K7IJC2uC";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /*
           =====================================================
           LOGIN
           =====================================================
        */

        const loginForm =
            document.getElementById("loginForm");

        const loginButton =
            document.getElementById("loginButton");

        const message =
            document.getElementById("message");


        function showMessage(text, type) {

            message.textContent = text;

            message.className = type;

        }


        loginForm.addEventListener("submit", async function(event) {

            event.preventDefault();


            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;


            if (!email || !password) {

                showMessage(
                    "Please enter email and password.",
                    "error"
                );

                return;
            }


            loginButton.disabled = true;

            loginButton.textContent = "Logging in...";


            try {

                const {
                    data,
                    error
                } = await supabaseClient.auth.signInWithPassword({

                    email: email,

                    password: password

                });


                if (error) {

                    throw error;

                }


                if (!data.session) {

                    throw new Error(
                        "Login session was not created."
                    );

                }


                showMessage(
                    "✅ Login successful!",
                    "success"
                );


                setTimeout(function() {

                    window.location.href =
                        "index.html";

                }, 700);


            } catch (error) {

                console.error(
                    "LOGIN ERROR:",
                    error
                );


                showMessage(
                    "❌ " +
                    (error.message ||
                        "Invalid email or password."),
                    "error"
                );


                loginButton.disabled = false;

                loginButton.textContent =
                    "🔐 Login";

            }

        });
    </script>

</body>

</html>
